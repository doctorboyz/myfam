services:
  app:
    image: myfam-app:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://myfam.doctorboyz.com}
    container_name: myfam-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - DATABASE_URL=postgresql://myfam:${POSTGRES_PASSWORD}@myfam-db:5432/myfam
      - NODE_ENV=production
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://api.ollama.com}
      - AI_RESPONSE_MODEL=${AI_RESPONSE_MODEL:-ollama:qwen3:32b}
      - AI_INTENT_MODEL=${AI_INTENT_MODEL:-ollama:qwen3:32b}
      - AI_EXTRACT_TEXT_MODEL=${AI_EXTRACT_TEXT_MODEL:-ollama:qwen3:32b}
      - AI_EXTRACT_SLIP_MODEL=${AI_EXTRACT_SLIP_MODEL:-ollama:qwen3:32b}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://myfam.doctorboyz.com}
    depends_on:
      myfam-db:
        condition: service_healthy
    networks:
      - server-network

  myfam-db:
    image: postgres:16-alpine
    container_name: myfam-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=myfam
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=myfam
    volumes:
      - myfam-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - server-network

volumes:
  myfam-db-data:

networks:
  server-network:
    external: true